version: 1
data_access:
  dry_run: true
  group_prefix: dac_
  schedule_mode: apply
  access_tag_key: data_access_control
  review_tag_key: clr_review_status
  conflict_policy: hold
  data_privileges:
  - SELECT
  allowed_catalogs: []
  interval_minutes: 60
  review_tag_value: reviewed
  schedule_enabled: true
  grant_concurrency: 48
  hierarchy_separator: .
  warehouse_autoscale: true
  membership_concurrency: 8
  warehouse_max_clusters: 8
  enrollment_catalog_tag_key: data_access_controlled
  warehouse_baseline_clusters: 4
  enrollment_catalog_tag_value: 'true'
